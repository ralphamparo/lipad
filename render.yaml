# Render blueprint for Lipad (this repo is the app, so no rootDir needed). In Render: New → Blueprint → pick the repo → it reads this file.
# TP_TOKEN and TP_MARKER are marked sync:false, so Render asks you to paste them in its dashboard
# instead of them ever living in the repo.
services:
  - type: web
    name: lipad
    runtime: node
    # free needs no card, but sleeps after ~15 min idle and has no disk (see below).
    # Change to "starter" (~$7/mo) for always-on plus the disk.
    plan: free
    region: singapore # closest region to the Philippines
    buildCommand: "" # no dependencies to install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: TP_TOKEN
        sync: false
      - key: TP_MARKER
        sync: false
      - key: ADMIN_TOKEN # password for /admin.html; pick a strong one
        sync: false
      - key: NODE_VERSION
        value: "22"
    # Sponsors and their view/click counts live in data/ads.json, which the free plan wipes on
    # restart. On the starter plan, uncomment this to keep them:
    # disk:
    #   name: lipad-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
